<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <rect x="10" y="10" width="1080" height="680" rx="24" ry="24" fill="#f7fbff" stroke="#92a9c0" stroke-width="4"/>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f3c72">AWS Kubernetes Infrastructure Architecture</text>

  <rect x="40" y="90" width="1020" height="560" rx="20" ry="20" fill="#ffffff" stroke="#d4e2f0" stroke-width="3"/>
  <text x="60" y="130" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#345678">AWS Default VPC</text>

  <rect x="70" y="160" width="460" height="240" rx="18" ry="18" fill="#e8f3ea" stroke="#76a987" stroke-width="3"/>
  <text x="100" y="200" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20582c">Control Plane</text>
  <text x="100" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#20442f">EC2 instance running:</text>
  <text x="100" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#20442f">• kube-apiserver</text>
  <text x="100" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#20442f">• etcd</text>
  <text x="100" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#20442f">• scheduler / controller-manager</text>
  <text x="100" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#20442f">• Calico CNI</text>

  <rect x="580" y="160" width="460" height="240" rx="18" ry="18" fill="#eef7f2" stroke="#7db47f" stroke-width="3"/>
  <text x="610" y="200" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#20582c">Worker Nodes</text>
  <rect x="620" y="230" width="160" height="100" rx="14" ry="14" fill="#ffffff" stroke="#6f9e7f" stroke-width="2"/>
  <text x="640" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#164a2d">Worker 1</text>
  <text x="640" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#164a2d">kubelet, kube-proxy, pods</text>
  <rect x="800" y="230" width="160" height="100" rx="14" ry="14" fill="#ffffff" stroke="#6f9e7f" stroke-width="2"/>
  <text x="820" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#164a2d">Worker 2</text>
  <text x="820" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#164a2d">kubelet, kube-proxy, pods</text>
  <rect x="710" y="360" width="160" height="100" rx="14" ry="14" fill="#ffffff" stroke="#6f9e7f" stroke-width="2"/>
  <text x="730" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#164a2d">Node Exporter</text>
  <text x="730" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#164a2d">metrics exporter</text>

  <rect x="340" y="430" width="420" height="210" rx="18" ry="18" fill="#fff6e6" stroke="#d48d36" stroke-width="3"/>
  <text x="370" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#7f4d1a">Monitoring Stack</text>
  <text x="370" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6e492f">Runs inside the cluster under the monitoring namespace.</text>
  <rect x="390" y="530" width="140" height="110" rx="14" ry="14" fill="#fff2d8" stroke="#d48d36" stroke-width="2"/>
  <text x="410" y="560" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8a4f1d">Prometheus</text>
  <text x="410" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a4f1d">metrics collection</text>
  <rect x="570" y="530" width="140" height="110" rx="14" ry="14" fill="#fff2d8" stroke="#d48d36" stroke-width="2"/>
  <text x="590" y="560" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8a4f1d">Grafana</text>
  <text x="590" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a4f1d">dashboard UI</text>
  <rect x="750" y="530" width="140" height="110" rx="14" ry="14" fill="#fff2d8" stroke="#d48d36" stroke-width="2"/>
  <text x="770" y="560" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8a4f1d">Alertmanager</text>
  <text x="770" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8a4f1d">alert delivery</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3c7a4d" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d48d36" />
    </marker>
  </defs>

  <line x1="500" y1="280" x2="580" y2="280" stroke="#3c7a4d" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="520" y="265" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c7a4d">API / control plane</text>

  <line x1="720" y1="310" x2="720" y2="430" stroke="#3c7a4d" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="620" y1="380" x2="620" y2="430" stroke="#3c7a4d" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="820" y1="380" x2="820" y2="430" stroke="#3c7a4d" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <line x1="770" y1="460" x2="720" y2="530" stroke="#d48d36" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="760" y="485" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#d48d36">metrics scrape</text>

  <line x1="640" y1="520" x2="640" y2="530" stroke="#d48d36" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <line x1="720" y1="520" x2="720" y2="530" stroke="#d48d36" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <text x="70" y="620" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3a4f6c">Control plane and workers are provisioned by Terraform in `tf-k8s/`.</text>
  <text x="70" y="640" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3a4f6c">Monitoring is installed from `monitoring/` and includes Prometheus, Grafana, and Alertmanager.</text>
</svg>
