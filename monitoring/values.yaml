## Prometheus Helm values for kube-prometheus-stack
## Adjust these settings to match your cluster and alerting preferences.

fullnameOverride: monitoring
prometheusOperator:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    externalLabels:
      cluster: cka-cluster

alertmanager:
  enabled: true
  alertmanagerSpec:
    logLevel: info

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

grafana:
  enabled: true
  adminUser: admin
  adminPassword: prometheus
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false

serviceAccounts:
  server:
    create: true

prometheusRule:
  enabled: true
