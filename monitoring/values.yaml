## Prometheus Helm values for kube-prometheus-stack
## Adjust these settings to match your cluster and alerting preferences.

fullnameOverride: monitoring
prometheusOperator:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    externalLabels:
      cluster: cka-cluster

alertmanager:
  enabled: true
  alertmanagerSpec:
    logLevel: info
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
    - name: 'default'
      # Email receiver (configure with your SMTP settings)
      # email_configs:
      #   - to: 'your-email@example.com'
      #     from: 'alertmanager@example.com'
      #     smarthost: 'smtp.gmail.com:587'
      #     auth_username: 'your-email@gmail.com'
      #     auth_password: 'your-app-password'
      # Slack receiver (configure with your webhook URL)
      # slack_configs:
      #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
      #     channel: '#alerts'
      #     title: 'Prometheus Alert'
      #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      # PagerDuty receiver (configure with your integration key)
      # pagerduty_configs:
      #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

grafana:
  enabled: true
  adminUser: admin
  adminPassword: prometheus
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false

serviceAccounts:
  server:
    create: true

prometheusRule:
  enabled: true
